[project]
name = "rd3g"
version = "0.1.0"
description = "Research framework for differential dynamic game solvers"
readme = "README.md"
requires-python = ">=3.12, <3.13"
authors = [
  {name = "Nick Zhang", email = "nickzhang@gatech.edu"}
]
dependencies = [
    "numpy",
    "matplotlib",
    "jax",
    "casadi",
    "qdldl",
    "buzzracer",
    "pillow>=11.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rd3g/"]

[tool.uv.sources]
buzzracer = { path = "../buzzracer", editable = true }
